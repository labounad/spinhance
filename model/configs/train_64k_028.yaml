# 028 recipe at 64k, on the CORRECTED (Audit-2) data. = the 025 base (matrix, shift 2x,
# NO peak channel / soft-equiv) PLUS a cumulative-integral input channel
# (use_cumint_channel): a 2nd conv input = the running integral of the spectrum, encoding
# relative proton counts the local conv stem can't compute. Targets the degeneracy
# 2H-vs-1H area confusion (per-class eval: d=2 recall ~0.86, mostly mis-called d=1).
# rebuild_64k_028 vs rebuild_64k_025 isolates the integral channel. 90 MHz only;
# data paths + batch=512 from train_rebuild.slurm (SAMPLE_N=64000).
run:
  name: spingraph_028_64k
  output_dir: model/runs

data:
  records: mol_to_spin_system/data/spin_systems_chembl.json
  spectra: simulation/data/spectra
  field: 90
  split: none

model:
  name: spingraph_decoder
  size: medium
  dim: 256
  enc_layers: 2
  dec_layers: 4
  n_heads: 8
  dropout: 0.1
  use_cumint_channel: true     # the experiment: cumulative-integral 2nd input channel

loss:
  name: composite
  terms:
    - name: matrix
      weight: 1.0
      weights:                  # shift weighted 2x (same as 025)
        shift: 2.0
        jmag: 1.0
        presence: 0.5
        deg: 0.5

training:
  epochs: 100
  batch_size: 256
  lr: 0.0003
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.05
  lr_stable_frac: 0.60
  lr_min_factor: 0.40
  grad_clip: 1.0
  patience: 20
  num_workers: 8
  val_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 50
  probe_every_epochs: 5
  probe_count: 16
