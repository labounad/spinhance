# 3M tier — "xl 026": the capacity top of the data x capacity scaling sweep — the same
# spingraph_decoder + 026 ideas (peak-channel + soft-equivalence) as the 64k/light (~10M) and
# 500k/med (~57M) tiers, widened + deepened to ~137M so the largest-data tier gets the largest
# model. Trained on the FULL corrected 2.81M train split (records_3M_train.json.gz).
#   model : spingraph_decoder size=xl (TIER_PRESETS: deep conv stem + dim768/enc6/dec8, ~137M)
#   loss  : matrix (shift-2x) + soft_equiv (Idea 2)
# Stability: a peak-LR edge-of-stability divergence recurs at ep6-7 (the med ~57M diverged at ep7
# on 1M; this 137M diverged at ep6 even at lr 1.5e-4 — a FINITE grad cascade 9->703->...->6.9e18
# that global-norm clip can't damp and the non-finite guard misses). Mitigations: peak LR -> 1e-4,
# warmup -> 0.07, and grad_spike_factor=8 (skip the spiking batch). Trains on a single A100.

run:
  name: spingraph_xl_026_3M
  output_dir: model/runs

data:
  records: data/pubchem/spin_systems_pubchem.json.gz
  parts: data/pubchem/spectra_parts/90MHz
  field: 90
  split: none
  max_mol: 0                                     # override with --set data.max_mol=<N>
  preload: false           # full 3.2M is ~196GB RAM-resident — stream from mmap'd shards

model:
  name: spingraph_decoder
  size: xl                 # model tier: 3M ~137M (TIER_PRESETS: stem deep, dim768/enc6/dec8)
  dropout: 0.1
  use_peak_channel: true        # Idea 1
  use_soft_equiv: true          # Idea 2 — expose soft_equiv_logits for the loss + decode

loss:
  name: composite
  terms:
    - name: matrix
      sym_jmag: true            # symmetry-aware (automorphism-invariant) coupling term
      weight: 1.0
      weights:
        shift: 2.0
        jmag: 1.0
        presence: 0.5
        deg: 0.5
    - name: soft_equiv          # Idea 2: BCE on the edge equivalence flag vs the canonical
                                #   SYMMETRY-ORBIT label (chemically-equivalent groups kept as
                                #   distinct nodes; NOT shift proximity) + a shift-consistency pull.
      weight: 0.5
      consistency_weight: 1.0   # pull orbit-equivalent pairs' predicted shifts together

training:
  epochs: 60
  batch_size: 256
  lr: 0.00004               # 4e-5 (40u) peak: more conservative than the 025/027 5e-5. Warmup ramps
                            # to this, then cosine-decays IMMEDIATELY (no plateau). DO NOT raise.
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.07         # linear ramp UP to the 4e-5 peak
  lr_stable_frac: 0.0       # NO peak hold — start the cosine decay right after warmup, avoiding the
                            # long-peak-plateau edge-of-stability wall entirely ("slowly back down")
  lr_min_factor: 0.25       # cosine floor = 0.25*4e-5 = 1e-5 (10u): slow decay 40u -> 10u over ~93% of steps
  grad_clip: 0.5            # global-norm clip; insufficient alone (see grad_spike_factor below)
  grad_spike_factor: 8.0    # skip a step whose grad-norm spikes >8x the running EMA — catches the
                            # FINITE blow-ups (703->...->6.9e18) that clip can't damp and the
                            # non-finite guard misses. The real fix for the ep6/ep7 divergence.
  patience: 30               # WSD: must bridge the peak-LR plateau into the decay (~ep30+); 8 stopped runs mid-plateau, undertrained
  num_workers: 2
  val_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 200
  probe_every_epochs: 2
  probe_count: 16
