# 500k tier — "med 026": the 025 scale-up PLUS the two 026 architecture ideas
# (peak-channel input + soft-equivalence flag/loss/averaging). Pairs with med_025 to
# isolate whether the 026 features still help at med (~57M) capacity on 500k data.
#   model : spingraph_decoder size=med + use_peak_channel (Idea 1)
#   loss  : matrix (shift-2x) + soft_equiv (Idea 2)

run:
  name: spingraph_med_026_500k
  output_dir: model/runs

data:
  records: data/pubchem/spin_systems_pubchem.json.gz
  parts: data/pubchem/spectra_parts/90MHz
  field: 90
  split: none
  max_mol: 0                                     # override with --set data.max_mol=<N>
  preload: true            # RAM-resident (fast on GPFS); ~196GB for full 3.2M (needs big-RAM node)

model:
  name: spingraph_decoder
  size: med                # model tier: 500k ~57M (TIER_PRESETS: stem deep, dim512/enc4/dec6)
  dropout: 0.1
  use_peak_channel: true        # Idea 1
  use_soft_equiv: true          # Idea 2 — expose soft_equiv_logits for the loss + decode

loss:
  name: composite
  terms:
    - name: matrix
      sym_jmag: true            # symmetry-aware (automorphism-invariant) coupling term
      weight: 1.0
      weights:
        shift: 2.0
        jmag: 1.0
        presence: 0.5
        deg: 0.5
    - name: soft_equiv          # Idea 2: BCE on the edge equivalence flag vs the canonical
                                #   SYMMETRY-ORBIT label (chemically-equivalent groups kept as
                                #   distinct nodes; NOT shift proximity) + a shift-consistency pull.
      weight: 0.5
      consistency_weight: 1.0   # pull orbit-equivalent pairs' predicted shifts together

training:
  epochs: 60
  batch_size: 256
  lr: 0.0002                # halved from 4e-4: the 56M decoder diverged at ep7 (val shift 0.140->12.9 ppm) on the 1M set
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.05         # longer warmup (was 0.02) to settle the transformer decoder before peak LR
  lr_stable_frac: 0.50
  lr_min_factor: 0.30
  grad_clip: 0.5            # tighter (was 1.0) to clamp the gradient spike that blew up ep7
  patience: 8
  # see train_500k_025.yaml — low workers to avoid the per-worker
  # 500k-record copy thrashing a 16GB g6.xlarge. Full 3.2M needs a big-RAM box.
  num_workers: 2
  val_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 200
  probe_every_epochs: 2
  probe_count: 16
