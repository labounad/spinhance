# 500k tier — "med 027": the 500k companion to train_64k_027. = the 025 base
# (matrix, shift 2x) PLUS focal modulation (focal CE on degeneracy + focal BCE on presence).
# model size=med (~57M). 90 MHz only.

run:
  name: spingraph_med_027_500k
  output_dir: model/runs

data:
  records: data/pubchem/spin_systems_pubchem.json.gz
  parts: data/pubchem/spectra_parts/90MHz
  field: 90
  split: none
  max_mol: 0
  preload: true

model:
  name: spingraph_decoder
  size: med                # model tier: 500k ~57M (TIER_PRESETS: stem deep, dim512/enc4/dec6)
  dropout: 0.1
  # NO peak/soft-equiv — 027 is a 025-recipe + focal ablation.

loss:
  name: composite
  terms:
    - name: matrix
      sym_jmag: true            # symmetry-aware (automorphism-invariant) coupling term
      weight: 1.0
      weights:
        shift: 2.0
        jmag: 1.0
        presence: 0.5
        deg: 0.5
      deg_focal_gamma: 2.0       # focal CE on degeneracy (rare-class)
      presence_focal_gamma: 2.0  # focal BCE on coupling presence

training:
  epochs: 60
  batch_size: 256
  lr: 0.0002
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.07         # settle decoder before peak LR (developed schedule)
  lr_stable_frac: 0.15      # short peak plateau: LR decays early, before edge-of-stability
  lr_min_factor: 0.30
  grad_clip: 0.5            # global-norm clip (works with grad_spike_factor)
  grad_spike_factor: 8.0    # skip a step whose grad-norm spikes >8x the running EMA
  patience: 30               # WSD: must bridge the peak-LR plateau into the decay (~ep30+); 8 stopped runs mid-plateau, undertrained
  num_workers: 2
  val_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 200
  probe_every_epochs: 2
  probe_count: 16
