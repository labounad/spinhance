# 500k tier — "med 025": the 025 matrix recipe at the med (~57M) capacity on the
# 500k-molecule data tier. Isolates more-data + bigger-model vs the 64k/light 025 run.
#   model : spingraph_decoder size=med (TIER_PRESETS: deep conv stem + dim512/enc4/dec6, ~57M)
#   data  : PubChem 90 MHz ONLY (hard input constraint), stacked part_<k>.npy shards.
#   loss  : matrix only, shift weighted 2x (identical recipe to the 64k 025).

run:
  name: spingraph_med_025_500k
  output_dir: model/runs

data:
  records: data/pubchem/spin_systems_pubchem.json.gz
  parts: data/pubchem/spectra_parts/90MHz      # stacked shards -> StackedSpectra
  field: 90
  split: none                                   # random 70/20/10 (scaffold too slow at 3M)
  max_mol: 0                                     # 0 = full 3.2M (set >0 for a faster prelim subset)
  preload: true            # RAM-resident (fast on GPFS); ~196GB for full 3.2M (needs big-RAM node)

model:
  name: spingraph_decoder
  size: med                # model tier: 500k ~57M (TIER_PRESETS: stem deep, dim512/enc4/dec6)
  dropout: 0.1
  # NO use_peak_channel here — keep this a clean 025-recipe scale-up.

loss:
  name: composite
  terms:
    - name: matrix
      sym_jmag: true            # symmetry-aware (automorphism-invariant) coupling term
      weight: 1.0
      weights:                  # shift weighted 2x (same as 025)
        shift: 2.0
        jmag: 1.0
        presence: 0.5
        deg: 0.5

training:
  epochs: 60
  batch_size: 256
  lr: 0.0002                # halved from 4e-4: the 56M decoder diverged at ep7 (val shift 0.118->12.9 ppm) on the 1M set
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.05         # longer warmup (was 0.02) to settle the transformer decoder before peak LR
  lr_stable_frac: 0.50
  lr_min_factor: 0.30
  grad_clip: 0.5            # tighter (was 1.0) to clamp the gradient spike that blew up ep7
  patience: 8
  # LOW worker count on purpose: each persistent DataLoader worker (train AND val)
  # forks a copy of the records list, and Python refcounting breaks copy-on-write,
  # so 8 workers x ~1GB/500k-record copy thrashes a 16GB g6.xlarge. 2 is plenty
  # since the xl model's per-step GPU time dwarfs item prep. NOTE: the FULL 3.2M set
  # (~6-8GB/copy) needs a big-RAM instance (g6.2xlarge 32GB / g6.4xlarge 64GB) or a
  # leaner dataset, regardless of this value.
  num_workers: 2
  val_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 200
  probe_every_epochs: 2
  probe_count: 16
