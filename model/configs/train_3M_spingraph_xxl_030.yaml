# 030 "super model" at xxl (137M) — the 3M-tier super model. = the xxl 137M scale-up with
# every winning ingredient: 026 peak-channel + soft-equivalence, 027 focal modulation, and
# 028's cumulative-integral input channel. Full corrected 2.81M train split (preload=false →
# overridden to preload on a big-RAM node at submit). xxl stability tuning (lr 1.5e-4).
run:
  name: spingraph_xxl_030_3M
  output_dir: model/runs

data:
  records: data/pubchem/spin_systems_pubchem.json.gz
  parts: data/pubchem/spectra_parts/90MHz
  field: 90
  split: none
  max_mol: 0
  preload: false           # full 3.2M is ~196GB RAM-resident — set preload + big-RAM node at submit

model:
  name: spingraph_decoder
  size: xl                  # CNN-encoder preset; transformer scaled via dim/enc/dec below
  dim: 768
  enc_layers: 6
  dec_layers: 8
  n_heads: 8
  dropout: 0.1
  use_peak_channel: true        # 026 Idea 1
  use_soft_equiv: true          # 026 Idea 2
  use_cumint_channel: true      # 028: cumulative-integral input channel

loss:
  name: composite
  terms:
    - name: matrix
      weight: 1.0
      weights:
        shift: 2.0
        jmag: 1.0
        presence: 0.5
        deg: 0.5
      deg_focal_gamma: 2.0       # 027: focal CE on degeneracy
      presence_focal_gamma: 2.0  # 027: focal BCE on presence
    - name: soft_equiv          # 026 Idea 2
      weight: 0.5
      tol_ppm: 0.03
      consistency_weight: 1.0

training:
  epochs: 60
  batch_size: 256
  lr: 0.00015               # the 137M decoder is divergence-prone; match xxl_026
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.05
  lr_stable_frac: 0.50
  lr_min_factor: 0.30
  grad_clip: 0.5
  patience: 8
  num_workers: 2
  val_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 200
  probe_every_epochs: 2
  probe_count: 16
