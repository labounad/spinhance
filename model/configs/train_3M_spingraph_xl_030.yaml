# 030 "super model" at xl (57M) — the 500k-tier super model. = 029 (026 peak-channel +
# soft-equivalence + 027 focal) PLUS 028's cumulative-integral input channel. Every winning
# ingredient combined. Used for the 500k tier via SAMPLE_N=500000. 90 MHz; xl stability tuning.
run:
  name: spingraph_xl_030
  output_dir: model/runs

data:
  records: data/pubchem/spin_systems_pubchem.json.gz
  parts: data/pubchem/spectra_parts/90MHz
  field: 90
  split: none
  max_mol: 0
  preload: true

model:
  name: spingraph_decoder
  size: xl
  dim: 512
  enc_layers: 4
  dec_layers: 6
  n_heads: 8
  dropout: 0.1
  use_peak_channel: true        # 026 Idea 1
  use_soft_equiv: true          # 026 Idea 2
  use_cumint_channel: true      # 028: cumulative-integral input channel

loss:
  name: composite
  terms:
    - name: matrix
      sym_jmag: true            # symmetry-aware (automorphism-invariant) coupling term
      weight: 1.0
      weights:
        shift: 2.0
        jmag: 1.0
        presence: 0.5
        deg: 0.5
      deg_focal_gamma: 2.0       # 027: focal CE on degeneracy
      presence_focal_gamma: 2.0  # 027: focal BCE on presence
    - name: soft_equiv          # 026 Idea 2
      weight: 0.5
      tol_ppm: 0.03
      consistency_weight: 1.0

training:
  epochs: 60
  batch_size: 256
  lr: 0.0002
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.05
  lr_stable_frac: 0.50
  lr_min_factor: 0.30
  grad_clip: 0.5
  patience: 8
  num_workers: 2
  val_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 200
  probe_every_epochs: 2
  probe_count: 16
