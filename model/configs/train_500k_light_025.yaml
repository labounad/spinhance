# "LIGHT" run — medium (10M) spingraph_decoder on a RANDOM 500k PubChem sample,
# 025 recipe (matrix, shift weighted 2x). Companion to the heavy xl/3M runs: fast
# turnaround for the presentation + a data-scaling point (same medium model as the
# 64k production 025, now on ~8x the data via a uniform random sample). 90 MHz only.
# Submit on an A6000 via model/scripts/train_hpc.slurm (it overrides data paths +
# batch=512/workers=4; sample_n/epochs/lr/model come from here).
run:
  name: light_025_500k
  output_dir: model/runs

data:
  records: data/pubchem/spin_systems_pubchem.json.gz   # -> gpfs path by the sbatch
  parts: data/pubchem/spectra_parts/90MHz              # -> gpfs path by the sbatch
  field: 90
  split: none
  sample_n: 500000          # uniform random subset (reservoir); NOT first-500k
  sample_seed: 0
  preload: true            # RAM-resident spectra (fast on GPFS); ~33GB for 500k

model:
  name: spingraph_decoder
  size: medium
  dim: 256
  enc_layers: 2
  dec_layers: 4
  n_heads: 8
  dropout: 0.1

loss:
  name: composite
  terms:
    - name: matrix
      weight: 1.0
      weights:
        shift: 2.0
        jmag: 1.0
        presence: 0.5
        deg: 0.5

training:
  epochs: 30
  batch_size: 256           # -> 512 by the sbatch
  lr: 0.0005
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.03
  lr_stable_frac: 0.55
  lr_min_factor: 0.35
  grad_clip: 1.0
  patience: 6
  num_workers: 4
  val_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 100
  probe_every_epochs: 3
  probe_count: 16
