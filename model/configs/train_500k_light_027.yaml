# "LIGHT" run 027 — medium (10M) spingraph_decoder on a RANDOM 500k PubChem sample.
# = light_025 recipe (matrix, shift 2x) PLUS focal modulation on the two imbalance
# terms (proposals #1 + #2): focal cross-entropy on degeneracy (lifts rare-class
# balanced accuracy) and focal BCE on coupling presence (sharpens the sparse,
# easy-negative-dominated boundary -> F1). Class-balance weights are already injected
# by the trainer (deg_class_weight / presence_pos_weight); focal compounds with them.
# Everything else identical to light_025 so this is a clean A/B on the focal terms.
# 90 MHz only. Submit via model/scripts/train_hpc_bundle.slurm.
run:
  name: light_027_500k
  output_dir: model/runs

data:
  records: data/pubchem/spin_systems_pubchem.json.gz   # -> gpfs path by the sbatch
  parts: data/pubchem/spectra_parts/90MHz              # -> gpfs path by the sbatch
  field: 90
  split: none
  sample_n: 500000          # uniform random subset (reservoir); NOT first-500k
  sample_seed: 0
  preload: true            # RAM-resident spectra (fast on GPFS); ~33GB for 500k

model:
  name: spingraph_decoder
  size: medium
  dim: 256
  enc_layers: 2
  dec_layers: 4
  n_heads: 8
  dropout: 0.1

loss:
  name: composite
  terms:
    - name: matrix
      weight: 1.0
      weights:
        shift: 2.0
        jmag: 1.0
        presence: 0.5
        deg: 0.5
      deg_focal_gamma: 2.0       # proposal #1: focal CE on degeneracy (rare-class)
      presence_focal_gamma: 2.0  # proposal #2: focal BCE on coupling presence

training:
  epochs: 80
  batch_size: 256           # -> 512 by the sbatch
  lr: 0.0005
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.03
  lr_stable_frac: 0.55
  lr_min_factor: 0.35
  grad_clip: 1.0
  patience: 10
  num_workers: 4
  val_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 100
  probe_every_epochs: 3
  probe_count: 16
