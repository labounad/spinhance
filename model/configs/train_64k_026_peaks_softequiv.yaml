# session026 — 025 recipe + two new architecture ideas, on the 64k ChEMBL set.
# Base = train_64k_spingraph_shift2x_matrixonly.yaml (production 025: spingraph_decoder
# medium, matrix loss with shift weighted 2x, WSD LR, 100 ep). Adds:
#   Idea 1 — model.use_peak_channel: a 2nd conv input channel (peak-emphasis map
#            derived in-model from the spectrum) as a shift-localization prior.
#   Idea 2 — soft_equiv loss term: supervises the edge head's soft-equivalence flag
#            (|delta_i - delta_j| <= 0.03 ppm) and pulls those predicted shifts
#            together; decode averages flagged groups so a degenerate pair renders
#            as one peak, not a split doublet.
# Everything else identical to 025 for an apples-to-apples comparison.
run:
  name: spingraph_026_peaks_softequiv
  output_dir: model/runs

data:
  records: mol_to_spin_system/data/spin_systems_chembl.json
  spectra: simulation/data/spectra
  field: 90
  split: none

model:
  name: spingraph_decoder
  size: medium
  dim: 256
  enc_layers: 2
  dec_layers: 4
  n_heads: 8
  dropout: 0.1
  use_peak_channel: true     # Idea 1

loss:
  name: composite
  terms:
    - name: matrix
      weight: 1.0
      weights:                  # shift weighted 2x (same as 025)
        shift: 2.0
        jmag: 1.0
        presence: 0.5
        deg: 0.5
    - name: soft_equiv          # Idea 2
      weight: 0.5
      tol_ppm: 0.03             # groups within 0.03 ppm are soft-equivalent
      consistency_weight: 1.0   # pull predicted shifts of soft-equiv pairs together

training:
  epochs: 100
  batch_size: 256
  lr: 0.0003
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.05
  lr_stable_frac: 0.60
  lr_min_factor: 0.40
  grad_clip: 1.0
  patience: 20
  num_workers: 8
  val_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 50
  probe_every_epochs: 5
  probe_count: 16
