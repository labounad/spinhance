# Train a differentiable surrogate matrix->spectrum renderer on 500k PubChem at
# 600 MHz. This is NOT a teacher for the 90-only inverse model — it's a standalone
# high-field renderer (e.g. recover the spin system from a cheap 90 MHz benchtop
# spectrum, then render it at 600 MHz to show the resolved structure).
#
# Resolution/lineshape chosen to match a REAL 600 MHz instrument export
# (600_spectrum.json): 2^16 points over 0-12 ppm (0.110 Hz/pt vs the real 0.091),
# 0.7 Hz linewidth (the measured typical isolated-singlet FWHM was 0.73-0.92 Hz),
# and a PSEUDO-VOIGT lineshape (eta=0.8 Lorentzian fraction) — fitting the real
# lines showed they are NOT pure Lorentzian but Voigt (Lorentzian T2 (x) Gaussian
# B0 inhomogeneity), eta ~ 0.8. The surrogate renders with the SAME eta so a
# Voigt-shaped target is reproducible from its predicted sticks.
#
# Targets are exact pyspin 600 MHz spectra at 2^16, generated by gen_600.slurm into
# bundle_600_2p16. Submit via train_surrogate_bundle.slurm with BUNDLE pointing at
# the 600 bundle and RECORDS at the shared 90-bundle records.json.gz.
run:
  name: surrogate_pubchem_600
  output_dir: model/runs

data:
  records: data/pubchem/spin_systems_pubchem.json.gz   # -> bundle_500k_s0/records.json.gz by the sbatch
  parts: data/pubchem/spectra_parts/600MHz             # -> bundle_600_2p16 by the sbatch
  fields: [600]             # 600 MHz ONLY
  split: none
  sample_n: 0               # bundle is already the 500k subset
  preload: false            # mmap (131 GB at 2^16 — too big to preload comfortably)

model:
  name: surrogate
  points: 65536             # 2^16 — matches the real-instrument digital resolution
  linewidth_hz: 0.7         # typical isolated-singlet FWHM measured on the real instrument
  lineshape_eta: 0.8        # pseudo-Voigt Lorentzian fraction (real lines are Voigt, not pure Lorentzian)
  dim: 256
  depth: 6
  heads: 8
  sticks_per_group: 48

loss:
  mse_weight: 0.3

training:
  epochs: 40
  batch_size: 128           # 2^16 spectra are 4x the memory of 2^14 -> smaller batch
  lr: 0.0003
  weight_decay: 0.01
  amp: bf16
  warmup_frac: 0.03
  grad_clip: 1.0
  num_workers: 4
  val_every: 1
  save_every: 1
  seed: 0

diagnostics:
  enabled: true
  log_every_steps: 100
